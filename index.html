<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b14"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>LIFE OS</title>
<style>
:root{--bg:#0b0b14;--c:#161628cc;--p:#8b5cf6;--t:#ecebff;--m:#9a98b8;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 20% 0,#2a1b5a,#0b0b14 55%) fixed;color:var(--t);font:15px system-ui,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
main{padding:calc(14px + env(safe-area-inset-top)) 14px 20px;max-width:640px;margin:auto}
.card{background:var(--c);backdrop-filter:blur(14px);border:1px solid #ffffff14;border-radius:20px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.big{font-size:22px;font-weight:700}small,.m{color:var(--m);font-size:12px}h3{margin:0 0 8px}
button{background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-size:15px;min-height:44px}
button.g{background:#ffffff14}button.d{background:#7f1d1d}button.s{padding:6px 10px;min-height:36px;border-radius:10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10101cee;backdrop-filter:blur(16px);padding:6px 2px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff14}
nav a{flex:1;text-align:center;font-size:11px;color:var(--m);padding:5px 0}nav a.on{color:#c4b5fd}nav a b{display:block;font-size:20px}
input,select,textarea{width:100%;background:#0b0b1488;color:var(--t);border:1px solid #ffffff22;border-radius:12px;padding:11px;font-size:15px;margin-top:4px}
label{display:block;margin:8px 0;color:var(--m);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}.it{padding:10px 0;border-bottom:1px solid #ffffff10}
.bar{height:8px;background:#ffffff14;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#38bdf8)}.bar.x i{background:var(--bad)}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px}.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.b i{width:100%;background:linear-gradient(#a78bfa,#6d28d9);border-radius:6px 6px 2px 2px;min-height:2px}.b.x i{background:linear-gradient(#f87171,#b91c1c)}
.b em,.b small{font-size:10px;font-style:normal;color:var(--m)}
#M{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:flex-end}#M.on{display:flex}
.sheet{background:#17172b;width:100%;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}.chips button{white-space:nowrap}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--p);background:none;padding:0;min-height:0;color:#fff;flex:none}.chk.on{background:var(--ok);border-color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:9px 0;border-radius:10px;font-size:13px}
.done{text-decoration:line-through;opacity:.5}#ind{position:fixed;top:4px;right:10px;font-size:10px;color:var(--m)}
</style></head><body><span id=ind></span><main></main><div id=M></div>
<nav><a id=n_today onclick="go('today')"><b>🏠</b>Bugün</a><a id=n_habits onclick="go('habits')"><b>🔥</b>Alışkanlık</a><a id=n_time onclick="go('time')"><b>⏱</b>Zaman</a><a id=n_plan onclick="go('plan')"><b>✅</b>Plan</a><a id=n_stats onclick="go('stats')"><b>📊</b>Rapor</a><a id=n_more onclick="go('more')"><b>☰</b>Daha</a></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>key(new Date());
const add=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return key(d)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const CATS=['İş','Araştırma','Eğitim','Kitap','Spor','Proje','Eğlence','Sosyal medya','Diğer'],PROD=CATS.slice(0,6),DIG=['Reels','Sosyal','Telefon','Oyun'];
const FQ={'Her gün':null,'Hafta içi':[1,2,3,4,5],'Hafta sonu':[0,6],'Haftada 3':[1,3,5]},PRI=['Yüksek','Orta','Düşük'];
const QUOTES=['Küçük adımlar büyük farklar yaratır.','Disiplin, motivasyonun bittiği yerde başlar.','Bugünün işi yarının özgürlüğüdür.','Mükemmel olmak değil, devam etmek önemli.','Her gün %1 daha iyi.','Önce en zor işi yap.'];
const hm=m=>m>=60?Math.floor(m/60)+'sa '+(m%60)+'dk':m+'dk',wd=d=>new Date(d+'T12:00').toLocaleDateString('tr-TR',{weekday:'short'});
const def=()=>({habits:[],hlog:{},tasks:[],tlog:[],timer:null,dlog:{},limits:{Reels:60,Sosyal:60,Telefon:120,Oyun:60},notes:{},goals:[]});
let db,st=def(),V='today',SUB='cal',tcat='İş',pf='day',sortP=0,selD=today(),cm=new Date(),sv;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('lifeos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=()=>new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});
const idbSet=s=>new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(s,'s');t.oncomplete=()=>res(1);t.onerror=()=>res(0)});
function save(){$('#ind').textContent='kaydediliyor…';clearTimeout(sv);sv=setTimeout(async()=>{try{await idbSet(JSON.parse(JSON.stringify(st)));$('#ind').textContent='✓ kaydedildi'}catch(e){$('#ind').textContent='⚠ kayıt hatası'}},200)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db)idbSet(JSON.parse(JSON.stringify(st)))});
// ---- hesaplar
const tm=(f,c)=>st.tlog.filter(e=>f(e.date)&&(!c||e.cat==c)).reduce((a,e)=>a+e.min,0),pm=d=>st.tlog.filter(e=>e.date==d&&PROD.includes(e.cat)).reduce((a,e)=>a+e.min,0);
const dg=d=>st.dlog[d]||{},dsum=d=>Object.values(dg(d)).reduce((a,b)=>a+b,0);
const sched=(h,d)=>!h.days||h.days.includes(new Date(d+'T12:00').getDay()),hd=(h,d)=>!!(st.hlog[d]&&st.hlog[d][h.id]&&st.hlog[d][h.id].d);
function streak(h){let d=today(),n=0;if(!hd(h,d))d=add(d,-1);for(let i=0;i<1000;i++){if(!sched(h,d)){d=add(d,-1);continue}if(!hd(h,d))break;n++;d=add(d,-1)}return n}
function score(d){const hs=st.habits.filter(h=>sched(h,d)),hn=hs.filter(h=>hd(h,d)).length,ts=st.tasks.filter(t=>t.date==d),tn=ts.filter(t=>t.status=='tamam').length,n=hs.length+ts.length,comp=n?(hn+tn)/n*100:0,w=pm(d),over=DIG.filter(k=>(dg(d)[k]||0)>st.limits[k]).length;
return{comp:Math.round(comp),prod:Math.max(0,Math.min(100,Math.round(comp*.6+Math.min(100,w/240*100)*.4-over*5))),hs:hs.length,hn,ts:ts.length,tn,w}}
function xp(){let x=0;for(const d in st.hlog)for(const i in st.hlog[d])if(st.hlog[d][i].d)x+=10;return x+st.tasks.filter(t=>t.status=='tamam').length*15+Math.floor(tm(()=>1)/30)*5}
const last=n=>[...Array(n)].map((_,i)=>add(today(),i-n+1));
function bars(v,l,o={}){const mx=Math.max(o.max||0,...v,1);return`<div class=bars>${v.map((x,i)=>`<div class="b ${o.lim&&x>o.lim?'x':''}"><em>${o.f?o.f(x):x}</em><i style="height:${x/mx*80}%"></i><small>${l[i]}</small></div>`).join('')}</div>`}
const pct=(a,b)=>b?Math.round(a/b*100):0;
// ---- modal / yardımcılar
function modal(title,fields,ok){$('#M').innerHTML=`<div class=sheet><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select id=f_${f.k}>${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='area'?`<textarea id=f_${f.k} rows=4>${E(f.v)}</textarea>`:`<input id=f_${f.k} type=${f.t||'text'} value="${E(f.v)}">`}</label>`).join('')}<div class=row><button class="g f" onclick=closeM()>İptal</button><button class=f id=okb>Kaydet</button></div></div>`;$('#M').className='on';
$('#okb').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value);ok(v);closeM();save();render()}}
const closeM=()=>$('#M').className='';
function dl(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const go=v=>{V=v;render();scrollTo(0,0)};
function render(){try{$('main').innerHTML=({today:vToday,habits:vHabits,time:vTime,plan:vPlan,stats:vStats,more:vMore})[V]()}catch(e){$('main').innerHTML='<div class=card>Bir hata oluştu: '+E(e.message)+'. Veriler güvende; Daha → Ayarlar bölümünden yedek alabilirsin.</div>'}
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id=='n_'+V))}
// ---- BUGÜN
function vToday(){const t=today(),s=score(t),x=xp(),lv=Math.floor(x/100)+1,c=n=>hm(tm(d=>d==t,n)),hs=st.habits.filter(h=>sched(h,t)),ts=st.tasks.filter(x=>x.date==t&&x.status!='tamam').slice(0,5);
return`<div class=row><div class=f><div class=m>${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class=big>LIFE OS</div></div><div class=m style=text-align:right>Seviye ${lv}<br>${x} XP</div></div>
<div class=bar style=margin:8px 0><i style=width:${x%100}%></i></div><div class=card><div class=row><svg width=92 height=92 viewBox="0 0 92 92"><circle cx=46 cy=46 r=38 fill=none stroke=#ffffff18 stroke-width=9 /><circle cx=46 cy=46 r=38 fill=none stroke=#a78bfa stroke-width=9 stroke-linecap=round stroke-dasharray=239 stroke-dashoffset=${239*(1-s.comp/100)} transform="rotate(-90 46 46)"/><text x=46 y=52 text-anchor=middle fill=#fff font-size=19 font-weight=700>%${s.comp}</text></svg><div class=f><b>Günlük tamamlanma</b><div class=m>“${QUOTES[new Date().getDate()%QUOTES.length]}”</div></div></div></div>
<div class=grid><div class=card><small>Görev</small><div class=big>${s.tn}/${s.ts}</div></div><div class=card><small>Üretkenlik puanı</small><div class=big>${s.prod}</div></div><div class=card><small>Çalışma (iş+proje)</small><div class=big>${hm(tm(d=>d==t,'İş')+tm(d=>d==t,'Proje'))}</div></div><div class=card><small>Araştırma</small><div class=big>${c('Araştırma')}</div></div><div class=card><small>Spor</small><div class=big>${c('Spor')}</div></div><div class=card><small>Kitap</small><div class=big>${c('Kitap')}</div></div><div class=card><small>Alışkanlık başarısı</small><div class=big>%${pct(s.hn,s.hs)}</div></div><div class=card><small>Ekran / sosyal medya</small><div class=big>${hm(dsum(t))}</div></div></div>
<div class=card><h3>Hızlı kayıt</h3><div class=row><button class=f onclick="taskForm()">+ Görev</button><button class=f onclick="minForm(today())">+ Süre</button><button class=f onclick="go('time')">${st.timer?'⏺ Çalışıyor':'▶ Kronometre'}</button></div></div>
<div class=card><h3>Haftalık üretkenlik</h3>${bars(last(7).map(d=>score(d).prod),last(7).map(wd),{max:100})}</div>
<div class=card><h3>Bugünkü alışkanlıklar</h3>${hs.map(h=>`<div class="row it"><button class="chk ${hd(h,t)?'on':''}" onclick="togH('${h.id}','${t}')">${hd(h,t)?'✓':''}</button><div class=f>${E(h.name)}</div><small>🔥${streak(h)}</small></div>`).join('')||'<div class=m>Henüz alışkanlık yok. Alışkanlık sekmesinden ekle.</div>'}</div>
<div class=card><h3>Bekleyen görevler</h3>${ts.map(x=>`<div class="row it"><button class=chk onclick="setS('${x.id}','tamam')"></button><div class=f>${E(x.title)}<br><small>${x.time||''} ${x.pri}</small></div></div>`).join('')||'<div class=m>Bugün için bekleyen görev yok.</div>'}</div>`}
function togH(id,d){const o=st.hlog[d]??={};o[id]??={d:false,m:0};o[id].d=!o[id].d;save();render()}
// ---- ALIŞKANLIK
function vHabits(){const t=today();return`<div class=big style=margin-bottom:10px>Alışkanlıklar</div><button style=width:100% onclick="habForm()">+ Yeni alışkanlık</button><div style=height:12px></div>`+st.habits.map(h=>{const w=last(7).filter(d=>sched(h,d)),wn=w.filter(d=>hd(h,d)).length,m=(st.hlog[t]||{})[h.id]?.m||0;
return`<div class=card><div class=row><button class="chk ${hd(h,t)?'on':''}" onclick="togH('${h.id}','${t}')">${hd(h,t)?'✓':''}</button><div class=f><b>${E(h.name)}</b><br><small>${h.fq} · hedef ${h.goal||0}dk · bugün ${m}dk</small></div><div>🔥${streak(h)}</div></div><div class=row style=margin:8px 0>${last(7).map(d=>`<div class=f style="height:8px;border-radius:4px;background:${!sched(h,d)?'#ffffff08':hd(h,d)?'var(--ok)':'#ffffff22'}"></div>`).join('')}</div><div class=row><small class=f>Haftalık başarı %${pct(wn,w.length)}</small><button class="s g" onclick="hMin('${h.id}')">⏱ Süre</button><button class="s g" onclick="habForm('${h.id}')">✎</button><button class="s d" onclick="delH('${h.id}')">🗑</button></div></div>`}).join('')||'<div class=card>Hiç alışkanlık yok.</div>'}
function habForm(id){const h=st.habits.find(x=>x.id==id)||{};modal(id?'Alışkanlığı düzenle':'Yeni alışkanlık',[{k:'name',l:'Ad',v:h.name},{k:'goal',l:'Günlük hedef (dk)',t:'number',v:h.goal??15},{k:'fq',l:'Tekrar sıklığı',o:Object.keys(FQ),v:h.fq}],v=>{if(!v.name.trim())return;const o=id?h:{id:uid()};Object.assign(o,{name:v.name.trim(),goal:+v.goal||0,fq:v.fq,days:FQ[v.fq]});if(!id)st.habits.push(o)})}
function hMin(id){const d=today(),o=(st.hlog[d]||{})[id]||{};modal('Süre gir',[{k:'m',l:'Bugünkü süre (dk)',t:'number',v:o.m||0}],v=>{const l=st.hlog[d]??={};l[id]={d:+v.m>0||!!o.d,m:+v.m||0}})}
function delH(id){if(confirm('Bu alışkanlık silinsin mi? Geçmiş kayıtları da silinir.')){st.habits=st.habits.filter(h=>h.id!=id);for(const d in st.hlog)delete st.hlog[d][id];save();render()}}
// ---- ZAMAN
function vTime(){const t=today(),r=st.timer;return`<div class=big style=margin-bottom:10px>Zaman takibi</div><div class=card><div class=chips>${CATS.map(c=>`<button class="s ${c==(r?r.cat:tcat)?'':'g'}" ${r?'disabled':''} onclick="tcat='${c}';render()">${c}</button>`).join('')}</div><div class=big id=tm style="text-align:center;font-size:40px;margin:8px">${r?el():'00:00:00'}</div>${r?`<button class=d style=width:100% onclick=tStop()>■ Durdur ve kaydet</button>`:`<button style=width:100% onclick=tStart()>▶ Başlat: ${tcat}</button>`}<div style=height:8px></div><button class=g style=width:100% onclick="minForm(today())">+ Manuel süre gir</button></div>
<div class=card><h3>Toplamlar</h3><table style=width:100%;font-size:13px><tr class=m><td></td><td>Gün</td><td>Hafta</td><td>Ay</td></tr>${CATS.map(c=>`<tr><td>${c}</td><td>${hm(tm(d=>d==t,c))}</td><td>${hm(tm(d=>d>add(t,-7),c))}</td><td>${hm(tm(d=>d.slice(0,7)==t.slice(0,7),c))}</td></tr>`).join('')}</table></div>
<div class=card><h3>Bugünün kayıtları</h3>${st.tlog.filter(e=>e.date==t).map(e=>`<div class="row it"><div class=f>${e.cat}</div><b>${hm(e.min)}</b><button class="s d" onclick="delT('${e.id}')">🗑</button></div>`).join('')||'<div class=m>Henüz kayıt yok.</div>'}</div>`}
const el=()=>{const s=Math.floor((Date.now()-st.timer.start)/1000),p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s/60)%60)+':'+p(s%60)};
function tStart(){if(st.timer)return;st.timer={cat:tcat,start:Date.now()};save();render()}
function tStop(){if(!st.timer)return;const m=Math.max(1,Math.round((Date.now()-st.timer.start)/60000));st.tlog.push({id:uid(),date:key(new Date(st.timer.start)),cat:st.timer.cat,min:m});st.timer=null;save();render()}
setInterval(()=>{if(st.timer&&$('#tm'))$('#tm').textContent=el()},1000);
function minForm(d){modal('Süre ekle · '+d,[{k:'c',l:'Kategori',o:CATS,v:tcat},{k:'m',l:'Süre (dk)',t:'number',v:30}],v=>{if(+v.m>0)st.tlog.push({id:uid(),date:d,cat:v.c,min:Math.round(+v.m)})})}
function delT(id){if(confirm('Kayıt silinsin mi?')){st.tlog=st.tlog.filter(e=>e.id!=id);save();render()}}
// ---- PLAN
function vPlan(){const t=today();let L=st.tasks.filter(x=>pf=='day'?x.date==t:pf=='week'?x.date>=t&&x.date<=add(t,6)&&x.status!='tamam':x.status=='tamam');if(sortP)L=[...L].sort((a,b)=>PRI.indexOf(a.pri)-PRI.indexOf(b.pri));
return`<div class=big style=margin-bottom:10px>Planlayıcı</div><div class=chips>${[['day','Bugün'],['week','Hafta'],['arch','Arşiv']].map(([k,n])=>`<button class="s ${pf==k?'':'g'}" onclick="pf='${k}';render()">${n}</button>`).join('')}<button class="s ${sortP?'':'g'}" onclick="sortP=!sortP;render()">Önceliğe göre</button></div><button style=width:100% onclick="taskForm()">+ Yeni görev</button><div style=height:12px></div><div class=card>${L.map(x=>`<div class=it><div class=row><button class="chk ${x.status=='tamam'?'on':''}" onclick="setS('${x.id}','${x.status=='tamam'?'bekliyor':'tamam'}')">${x.status=='tamam'?'✓':''}</button><div class=f><b class="${x.status=='tamam'?'done':''}">${E(x.title)}</b><br><small>${pf!='day'?x.date+' ':''}${x.time||''} · ${x.pri} · ${E(x.cat)} · ${x.est||0}dk · ${x.status}</small>${x.desc?`<br><small>${E(x.desc)}</small>`:''}</div></div><div class=row style=margin-top:6px><button class="s g" onclick="mv('${x.id}',-1)">▲</button><button class="s g" onclick="mv('${x.id}',1)">▼</button><button class="s g" onclick="setS('${x.id}','ertelendi')">Ertele</button><button class="s g" onclick="taskForm('${x.id}')">✎</button><button class="s d" onclick="delK('${x.id}')">🗑</button></div></div>`).join('')||'<div class=m>Bu görünümde görev yok.</div>'}</div>`}
function taskForm(id,d){const x=st.tasks.find(z=>z.id==id)||{};modal(id?'Görevi düzenle':'Yeni görev',[{k:'title',l:'Başlık',v:x.title},{k:'desc',l:'Açıklama',v:x.desc},{k:'date',l:'Tarih',t:'date',v:x.date||d||today()},{k:'time',l:'Saat',t:'time',v:x.time},{k:'pri',l:'Öncelik',o:PRI,v:x.pri||'Orta'},{k:'cat',l:'Kategori',o:CATS,v:x.cat||'İş'},{k:'est',l:'Tahmini süre (dk)',t:'number',v:x.est||30}],v=>{if(!v.title.trim())return;const o=id?x:{id:uid(),status:'bekliyor'};Object.assign(o,v,{title:v.title.trim(),est:+v.est||0,date:v.date||today()});if(!id)st.tasks.push(o)})}
function setS(id,s){const x=st.tasks.find(z=>z.id==id);if(!x)return;x.status=s;if(s=='ertelendi')x.date=add(x.date||today(),1);save();render()}
function delK(id){if(confirm('Görev silinsin mi?')){st.tasks=st.tasks.filter(x=>x.id!=id);save();render()}}
function mv(id,n){const i=st.tasks.findIndex(x=>x.id==id),t=st.tasks[i],j=st.tasks.findIndex((x,k)=>k*n>i*n&&x.date==t.date);if(j<0)return;st.tasks[i]=st.tasks[j];st.tasks[j]=t;sortP=0;save();render()}
// ---- RAPOR
function vStats(){const t=today(),l7=last(7),l30=last(30),wk=tm(d=>d>add(t,-7)),pw=tm(d=>d>add(t,-14)&&d<=add(t,-7)),cm_=CATS.map(c=>[c,tm(d=>d.slice(0,7)==t.slice(0,7),c)]).sort((a,b)=>b[1]-a[1]),tot=cm_.reduce((a,b)=>a+b[1],0);
let hs=0,hn=0;l30.forEach(d=>st.habits.forEach(h=>{if(sched(h,d)){hs++;if(hd(h,d))hn++}}));const best=[...l30].sort((a,b)=>score(b).prod-score(a).prod)[0],lim=Object.values(st.limits).reduce((a,b)=>a+b,0);
return`<div class=big style=margin-bottom:10px>Rapor</div><div class=card><h3>Bu hafta / geçen hafta</h3><div class=big>${hm(wk)} <small>(geçen hafta ${hm(pw)})</small></div><div class=m>${pw?`Fark: ${wk>=pw?'+':''}${pct(wk-pw,pw)}% — ${wk>=pw?'gelişiyorsun 💪':'geçen haftanın gerisindesin'}`:'Karşılaştırma için geçen haftaya ait kayıt yok.'}</div></div>
<div class="grid"><div class=card><small>En verimli gün (30g)</small><div class=big>${score(best).prod?best.slice(5)+' '+wd(best):'—'}</div></div><div class=card><small>En çok zaman (ay)</small><div class=big>${cm_[0][1]?cm_[0][0]:'—'}</div></div><div class=card><small>Alışkanlık başarısı (30g)</small><div class=big>%${pct(hn,hs)}</div></div><div class=card><small>Tamamlanan görev</small><div class=big>${st.tasks.filter(x=>x.status=='tamam').length}</div></div></div>
<div class=card><h3>Günlük üretkenlik</h3>${bars(l7.map(d=>score(d).prod),l7.map(wd),{max:100})}</div><div class=card><h3>Çalışma süresi (dk)</h3>${bars(l7.map(pm),l7.map(wd))}</div><div class=card><h3>Tamamlanan görev</h3>${bars(l7.map(d=>st.tasks.filter(x=>x.date==d&&x.status=='tamam').length),l7.map(wd))}</div>
<div class=card><h3>Spor (dk)</h3>${bars(l7.map(d=>tm(x=>x==d,'Spor')),l7.map(wd))}</div><div class=card><h3>Kitap (dk)</h3>${bars(l7.map(d=>tm(x=>x==d,'Kitap')),l7.map(wd))}</div>
<div class=card><h3>Ekran / sosyal medya (dk) <small>kırmızı = limit aşıldı</small></h3>${bars(l7.map(dsum),l7.map(wd),{lim})}</div>
<div class=card><h3>Bu ay kategori dağılımı</h3>${cm_.filter(c=>c[1]).map(c=>`<div class=it><div class=row><div class=f>${c[0]}</div><b>${hm(c[1])}</b></div><div class=bar><i style=width:${pct(c[1],tot)}%></i></div></div>`).join('')||'<div class=m>Bu ay kayıt yok.</div>'}</div>`}
// ---- DAHA
function vMore(){const T=[['cal','📅 Takvim'],['dig','📵 Dijital'],['note','📝 Not'],['goal','🎯 Hedef'],['set','⚙ Ayarlar']];return`<div class=chips>${T.map(([k,n])=>`<button class="s ${SUB==k?'':'g'}" onclick="SUB='${k}';render()">${n}</button>`).join('')}</div>`+({cal:vCal,dig:vDig,note:vNote,goal:vGoal,set:vSet})[SUB]()}
function vCal(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c=['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(x=>`<small>${x}</small>`).join('')+'<div></div>'.repeat(f);
for(let i=1;i<=n;i++){const d=key(new Date(y,m,i)),p=score(d).prod;c+=`<div onclick="selD='${d}';render()" style="background:rgba(139,92,246,${.08+p/130});${d==selD?'outline:2px solid #fff':''}">${i}</div>`}
const d=selD,s=score(d);return`<div class=card><div class=row><button class="s g" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><b class=f style=text-align:center>${cm.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</b><button class="s g" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div><div class=cal style=margin-top:8px>${c}</div></div>
<div class=card><h3>${d}</h3><div class=m>Tamamlanma %${s.comp} · Çalışma ${hm(s.w)} · Üretkenlik ${s.prod}</div>${st.habits.filter(h=>sched(h,d)).map(h=>`<div class="row it"><button class="chk ${hd(h,d)?'on':''}" onclick="togH('${h.id}','${d}')">${hd(h,d)?'✓':''}</button><div class=f>${E(h.name)}</div></div>`).join('')}${st.tasks.filter(x=>x.date==d).map(x=>`<div class="row it"><button class="chk ${x.status=='tamam'?'on':''}" onclick="setS('${x.id}','${x.status=='tamam'?'bekliyor':'tamam'}')">${x.status=='tamam'?'✓':''}</button><div class=f>${E(x.title)}</div></div>`).join('')}${st.tlog.filter(e=>e.date==d).map(e=>`<div class="row it"><div class=f>${e.cat}</div>${hm(e.min)}<button class="s d" onclick="delT('${e.id}')">🗑</button></div>`).join('')}${st.notes[d]?.text?`<p class=m>📝 ${E(st.notes[d].text)}</p>`:''}<div class=row style=margin-top:10px><button class=f onclick="taskForm(null,'${d}')">+ Görev</button><button class="f g" onclick="minForm('${d}')">+ Süre</button></div></div>`}
function vDig(){const t=today(),g=dg(t);return`<div class=card><h3>Bugünkü ekran kullanımı</h3>${DIG.map(k=>{const v=g[k]||0,L=st.limits[k];return`<div class=it><div class=row><div class=f><b>${k}</b><br><small>${v}dk / limit ${L}dk ${v>L?'⚠ aşıldı':''}</small></div><button class="s g" onclick="dAdd('${k}',15)">+15</button><button class="s g" onclick="dAdd('${k}',30)">+30</button><button class="s g" onclick="dForm('${k}')">✎</button></div><div class="bar ${v>L?'x':''}" style=margin-top:6px><i style=width:${Math.min(100,pct(v,L))}%></i></div></div>`}).join('')}</div><div class=card><h3>Son 7 gün (dk)</h3>${bars(last(7).map(dsum),last(7).map(wd),{lim:Object.values(st.limits).reduce((a,b)=>a+b,0)})}</div>`}
function dAdd(k,n){const g=st.dlog[today()]??={};g[k]=(g[k]||0)+n;save();render()}
function dForm(k){modal(k,[{k:'v',l:'Bugünkü süre (dk)',t:'number',v:dg(today())[k]||0},{k:'l',l:'Günlük maksimum (dk)',t:'number',v:st.limits[k]}],v=>{(st.dlog[today()]??={})[k]=Math.max(0,+v.v||0);st.limits[k]=Math.max(0,+v.l||0)})}
function vNote(){const d=today(),n=st.notes[d]||{};return`<div class=card><h3>Günlük not · ${d}</h3><textarea rows=7 placeholder="Bugün neler oldu?" oninput="nSet('text',this.value)">${E(n.text)}</textarea><label>Günün değerlendirmesi (1-5)<select onchange="nSet('rate',this.value)">${['','1','2','3','4','5'].map(r=>`<option ${r==(n.rate||'')?'selected':''}>${r}</option>`).join('')}</select></label></div>`}
function nSet(k,v){(st.notes[today()]??={})[k]=v;save()}
function vGoal(){const x=xp(),mx=Math.max(0,...st.habits.map(streak)),B=[['🌱 İlk adım',x>0],['🔥 7 gün seri',mx>=7],['✅ 10 görev',st.tasks.filter(t=>t.status=='tamam').length>=10],['⏳ 10 saat odak',tm(()=>1)>=600],['⭐ Seviye 5',x>=400]];
return`<button style=width:100% onclick="goalForm()">+ Uzun vadeli hedef</button><div style=height:12px></div>`+st.goals.map(g=>`<div class=card><div class=row><b class=f>${E(g.title)}</b><button class="s g" onclick="gAdd('${g.id}',-1)">−</button><button class="s g" onclick="gAdd('${g.id}',1)">+</button><button class="s d" onclick="gDel('${g.id}')">🗑</button></div><div class=bar style=margin:8px 0><i style=width:${Math.min(100,pct(g.cur,g.target))}%></i></div><small>${g.cur} / ${g.target} (%${pct(g.cur,g.target)})</small></div>`).join('')+`<div class=card><h3>Rozetler</h3>${B.map(([n,o])=>`<div class=it style="opacity:${o?1:.35}">${n} ${o?'✓':''}</div>`).join('')}</div>`}
function goalForm(){modal('Yeni hedef',[{k:'title',l:'Hedef',v:''},{k:'target',l:'Hedef değer (ör. 12 kitap)',t:'number',v:10}],v=>{if(v.title.trim())st.goals.push({id:uid(),title:v.title.trim(),target:+v.target||1,cur:0})})}
function gAdd(id,n){const g=st.goals.find(x=>x.id==id);g.cur=Math.max(0,g.cur+n);save();render()}
function gDel(id){if(confirm('Hedef silinsin mi?')){st.goals=st.goals.filter(g=>g.id!=id);save();render()}}
function vSet(){return`<div class=card><h3>Yedekleme</h3><button style=width:100% onclick=exJ()>JSON yedeği indir</button><div style=height:8px></div><button class=g style=width:100% onclick="$('#imp').click()">JSON yedeğini içe aktar</button><input id=imp type=file accept=.json hidden onchange=imJ(this)><div style=height:8px></div><button class=g style=width:100% onclick=exC()>CSV / Excel olarak dışa aktar</button></div><div class=card><h3>Veri</h3><button class=g style=width:100% onclick=sample()>Örnek alışkanlıkları ekle</button><div style=height:8px></div><button class=g style=width:100% onclick=clrS()>Örnek verileri temizle</button><div style=height:8px></div><button class=d style=width:100% onclick=reset()>Tüm verileri sıfırla</button></div><div class=card><small>Veriler bu cihazda IndexedDB içinde saklanır. Tarayıcı verisini temizlersen silinir; düzenli JSON yedeği al.</small></div>`}
function exJ(){dl(JSON.stringify(st,null,1),'lifeos-yedek-'+today()+'.json','application/json')}
function imJ(i){const f=i.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!Array.isArray(o.habits)||!Array.isArray(o.tasks))throw 0;if(confirm('Mevcut veriler yedekle değiştirilsin mi?')){st=Object.assign(def(),o);save();render()}}catch(e){alert('Geçersiz yedek dosyası.')}})}
function exC(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['tür','tarih','ad','değer']];for(const d in st.hlog)st.habits.forEach(h=>{const o=st.hlog[d][h.id];if(o)r.push(['alışkanlık',d,h.name,(o.d?'tamam':'yok')+' '+o.m+'dk'])});st.tasks.forEach(t=>r.push(['görev',t.date,t.title,t.status]));st.tlog.forEach(e=>r.push(['zaman',e.date,e.cat,e.min]));for(const d in st.dlog)for(const k in st.dlog[d])r.push(['ekran',d,k,st.dlog[d][k]]);dl('\ufeff'+r.map(a=>a.map(q).join(';')).join('\n'),'lifeos-'+today()+'.csv','text/csv')}
function sample(){['Spor yapmak','Kitap okumak','Su içmek','Meditasyon','İngilizce çalışmak'].forEach(n=>st.habits.push({id:uid(),name:n,goal:20,fq:'Her gün',days:null,s:1}));save();render()}
function clrS(){if(confirm('Örnek alışkanlıklar silinsin mi?')){st.habits=st.habits.filter(h=>!h.s);save();render()}}
function reset(){if(confirm('TÜM veriler silinecek. Emin misin?')&&confirm('Bu işlem geri alınamaz. Önce yedek aldın mı? Yine de sıfırla?')){st=def();save();render()}}
(async()=>{try{db=await open();st=Object.assign(def(),await idbGet()||{})}catch(e){alert('Depolama açılamadı. Özel gezinme modunda olabilirsin.')}
navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render()})();
</script></body></html>
